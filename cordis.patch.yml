# Sticky-window compaction, host plane.
#
# Two planes can own compaction, and this file handles the one that is a plain
# profile row:
#
# 1. Host plane (CLI, headless, SDK profiles): `compaction-basic` is an ordinary
#    row from the base bundle, so disabling it here and inserting this backend
#    in its place means the summarizing one never runs.
# 2. Preset plane (Web and Desktop profiles): the host rows are already disabled
#    and each agent preset isolates its own `compaction`, so a row here cannot
#    reach a session. `presets/sticky-window.patch.yml` declares that plane as a
#    preset the person can select; this bundle never changes which preset is
#    selected.
#
# Leaving the host row in place on a preset profile is harmless: it provides a
# service no isolated agent resolves.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- insert:
    - id: compaction-sticky-window
      name: 'dsh-compaction-sticky-window'
      config:
        # Pressure at 80% of the message budget.
        thresholdRatio: 0.8
        # Keep nothing verbatim: the fresh window is the system prompt, the
        # model's own note, and the turn in flight. A retained tail would leave
        # the model reading old messages instead of the note it was told to
        # write, which is the shape this backend exists to avoid.
        retainTokens: 0
        # The note is replaced wholesale on every rollover.
        noteMaxBytes: 6144
